<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaHub Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c10;
  --panel: #16161e;
  --card: #1c1c26;
  --border: rgba(255,255,255,0.07);
  --text: #e8e8f0;
  --muted: #7070888;
  --accent: #e63946;
  --gold: #f4c430;
  --blue: #4a90d9;
  --green: #50c878;
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── TOPBAR ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 56px;
  background: rgba(12,12,16,0.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 3px;
  color: var(--text); white-space: nowrap;
}
.logo b { color: var(--accent); }
#search-bar {
  flex: 1; max-width: 440px;
  display: flex; align-items: center;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
#search-bar input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 14px; font-family: 'Inter',sans-serif;
  padding: 10px 14px;
}
#search-bar input::placeholder { color: #555; }
#search-bar button {
  background: var(--accent); border: none; color: #fff;
  padding: 0 16px; height: 40px; cursor: pointer;
  font-size: 13px; font-weight: 600; font-family: 'Inter',sans-serif;
  transition: opacity .2s;
}
#search-bar button:hover { opacity: .8; }
.tab-row {
  display: flex; gap: 6px; margin-left: auto;
}
.tab-btn {
  background: none; border: 1px solid var(--border);
  color: #666; font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px; cursor: pointer;
  font-family: 'Inter',sans-serif; white-space: nowrap;
  transition: all .2s;
}
.tab-btn.on, .tab-btn:hover {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* ── LAYOUT ── */
#app { padding-top: 56px; }

/* ── VIEW PANELS ── */
.view { display: none; }
.view.active { display: block; }

/* ── HOME ── */
#home { padding: 28px 20px; max-width: 1200px; margin: 0 auto; }
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.section-head h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 2px;
}
.section-head .chip {
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
  background: var(--accent); color: #fff;
}
.manga-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 14px;
  margin-bottom: 40px;
}
.manga-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
  transition: transform .18s, box-shadow .18s;
}
.manga-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(0,0,0,.5);
}
.manga-cover {
  width: 100%; aspect-ratio: 2/3;
  object-fit: cover; display: block;
  background: var(--panel);
}
.manga-cover-placeholder {
  width: 100%; aspect-ratio: 2/3;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 36px; gap: 8px;
  color: #444;
}
.manga-info { padding: 10px 10px 12px; }
.manga-title {
  font-size: 12px; font-weight: 600;
  line-height: 1.4; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.manga-sub {
  font-size: 10px; color: #666; margin-top: 4px;
}
.tag-badge {
  display: inline-block; font-size: 9px; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; margin-top: 5px;
}
.tag-manga { background: rgba(230,57,70,.15); color: #f07070; }
.tag-manhwa { background: rgba(130,80,255,.15); color: #a87af5; }
.tag-manhua { background: rgba(255,140,60,.15); color: #f59d60; }

/* loading skeleton */
.skeleton {
  background: linear-gradient(90deg, #1c1c26 25%, #24243280 50%, #1c1c26 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius);
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-cover { width: 100%; aspect-ratio: 2/3; }
.skel-line { height: 11px; border-radius: 4px; margin-top: 8px; }
.skel-line.short { width: 60%; }

/* ── DETAIL ── */
#detail { max-width: 880px; margin: 0 auto; padding: 28px 20px; }
.back-btn {
  background: none; border: 1px solid var(--border);
  color: #888; font-size: 13px; font-family: 'Inter',sans-serif;
  padding: 7px 16px; border-radius: 8px; cursor: pointer;
  margin-bottom: 24px; transition: all .2s;
}
.back-btn:hover { color: var(--text); border-color: #888; }
.detail-hero {
  display: flex; gap: 24px; margin-bottom: 28px;
}
.detail-cover {
  width: 160px; flex-shrink: 0;
  border-radius: 10px; overflow: hidden;
  background: var(--panel);
}
.detail-cover img { width: 100%; display: block; }
.detail-meta h1 {
  font-size: 22px; font-weight: 700; line-height: 1.3;
  margin-bottom: 8px;
}
.detail-meta .meta-row {
  font-size: 12px; color: #888; margin-bottom: 6px;
}
.detail-meta .meta-row b { color: var(--text); }
.detail-desc {
  font-size: 13px; color: #888; line-height: 1.7;
  margin-top: 10px; max-height: 100px; overflow: hidden;
  position: relative;
}
.detail-desc.expanded { max-height: none; }
.read-more {
  font-size: 12px; color: var(--accent); cursor: pointer;
  margin-top: 4px; display: inline-block;
}

.chapter-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.chapter-head h3 { font-size: 16px; font-weight: 700; }
.chapter-count { font-size: 12px; color: #666; }
.chapter-list { display: flex; flex-direction: column; gap: 6px; }
.ch-item {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all .18s;
}
.ch-item:hover { background: #22222e; border-color: rgba(255,255,255,.15); }
.ch-num { font-size: 13px; font-weight: 600; }
.ch-title { font-size: 12px; color: #888; margin-top: 2px; }
.ch-meta { font-size: 11px; color: #555; text-align: right; }
.ch-read-btn {
  background: var(--accent); color: #fff; border: none;
  padding: 6px 14px; border-radius: 6px; font-size: 12px;
  font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif;
  margin-left: 12px; white-space: nowrap; transition: opacity .2s;
}
.ch-read-btn:hover { opacity: .8; }

/* ── READER ── */
#reader {
  max-width: 800px; margin: 0 auto; padding: 20px;
}
.reader-topbar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px; flex-wrap: wrap;
}
.reader-topbar h2 { font-size: 15px; font-weight: 600; flex: 1; }
.reader-nav {
  display: flex; gap: 8px;
}
.nav-btn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-family: 'Inter',sans-serif;
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
  transition: all .2s;
}
.nav-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.nav-btn:disabled { opacity: .3; cursor: default; }
.reader-pages {
  display: flex; flex-direction: column; gap: 4px;
  align-items: center;
}
.page-img {
  width: 100%; max-width: 800px;
  display: block; border-radius: 4px;
}
.page-loading {
  width: 100%; max-width: 800px; height: 1000px;
  background: var(--panel); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: #444; font-size: 13px;
}
.reader-bottom {
  display: flex; gap: 8px; justify-content: center;
  margin-top: 28px; padding-bottom: 40px;
}

/* ── EMPTY / ERROR ── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: #555;
}
.empty-state .icon { font-size: 52px; margin-bottom: 14px; }
.empty-state p { font-size: 14px; line-height: 1.7; }

/* ── SPINNER ── */
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* responsive */
@media(max-width:600px){
  .detail-hero { flex-direction: column; }
  .detail-cover { width: 120px; }
  .tab-row { display: none; }
  .logo { font-size: 18px; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">Manga<b>Hub</b></div>
  <div id="search-bar">
    <input type="text" id="q" placeholder="Cari judul manga, manhwa, manhua..." />
    <button onclick="doSearch()">Cari</button>
  </div>
  <div class="tab-row">
    <button class="tab-btn on" onclick="setFilter('all',this)">Semua</button>
    <button class="tab-btn" onclick="setFilter('manga',this)">Manga</button>
    <button class="tab-btn" onclick="setFilter('manhwa',this)">Manhwa</button>
    <button class="tab-btn" onclick="setFilter('manhua',this)">Manhua</button>
  </div>
</div>

<div id="app">
  <!-- HOME -->
  <div id="home" class="view active">
    <div id="home-content">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- DETAIL -->
  <div id="detail" class="view">
    <button class="back-btn" onclick="goHome()">← Kembali</button>
    <div id="detail-content"></div>
  </div>

  <!-- READER -->
  <div id="reader" class="view">
    <div class="reader-topbar">
      <button class="nav-btn" onclick="goDetail()">← Detail</button>
      <h2 id="reader-title">Memuat chapter...</h2>
    </div>
    <div id="reader-nav-top" class="reader-nav" style="margin-bottom:14px; justify-content:center;"></div>
    <div id="reader-pages" class="reader-pages"></div>
    <div id="reader-nav-bot" class="reader-bottom"></div>
  </div>
</div>

<script>
// ════════════════════════════════
// STATE
// ════════════════════════════════
const API = 'https://api.mangadex.org';
const CORS = 'https://api.allorigins.win/raw?url=';

let state = {
  filter: 'all',
  query: '',
  currentManga: null,
  chapters: [],
  currentChapterIdx: 0,
  detailMangaId: null,
};

// ════════════════════════════════
// UTILS
// ════════════════════════════════
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function goHome() { show('home'); }
function goDetail() {
  show('detail');
  if (state.detailMangaId) openDetail(state.detailMangaId);
}

async function apiFetch(url) {
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    console.error('API error:', url, e);
    return null;
  }
}

function getCover(mangaId, coverId, filename) {
  if (!filename) return null;
  return `https://uploads.mangadex.org/covers/${mangaId}/${filename}.256.jpg`;
}

function formatDate(str) {
  if (!str) return '';
  return new Date(str).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}

function getTitle(manga) {
  const t = manga.attributes.title;
  return t.id || t.en || t['ja-ro'] || t.ja || Object.values(t)[0] || 'No Title';
}

function getDesc(manga) {
  const d = manga.attributes.description;
  return d.id || d.en || Object.values(d)[0] || '';
}

function detectType(manga) {
  const country = manga.attributes.originalLanguage;
  if (country === 'ko') return 'manhwa';
  if (country === 'zh' || country === 'zh-hk') return 'manhua';
  return 'manga';
}

// ════════════════════════════════
// HOME — LOAD POPULAR
// ════════════════════════════════
async function loadHome() {
  document.getElementById('home-content').innerHTML = '<div class="spinner"></div>';

  const params = new URLSearchParams({
    limit: 24,
    'includes[]': 'cover_art',
    'order[followedCount]': 'desc',
    hasAvailableChapters: 'true',
    contentRating: 'safe,suggestive',
  });

  if (state.filter !== 'all') {
    const lang = { manga: 'ja', manhwa: 'ko', manhua: 'zh' };
    params.set('originalLanguage[]', lang[state.filter]);
  }

  if (state.query) {
    params.set('title', state.query);
  }

  const data = await apiFetch(`${API}/manga?${params}`);
  if (!data || !data.data?.length) {
    document.getElementById('home-content').innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>Tidak ada hasil untuk "<b>${state.query || 'pencarian ini'}</b>".<br>Coba kata kunci lain.</p>
      </div>`;
    return;
  }

  renderHome(data.data);
}

function renderHome(list) {
  const typeLabel = { manga:'Manga 🇯🇵', manhwa:'Manhwa 🇰🇷', manhua:'Manhua 🇨🇳' };
  const label = state.query
    ? `Hasil: "${state.query}"`
    : (state.filter === 'all' ? 'Populer Sekarang' : typeLabel[state.filter]);

  let html = `
    <div class="section-head">
      <h2>${label}</h2>
      <span class="chip">${list.length} judul</span>
    </div>
    <div class="manga-grid">
  `;

  for (const manga of list) {
    const title = getTitle(manga);
    const type = detectType(manga);
    const coverRel = manga.relationships?.find(r => r.type === 'cover_art');
    const coverFile = coverRel?.attributes?.fileName;
    const coverUrl = getCover(manga.id, coverRel?.id, coverFile);
    const tagClass = `tag-${type}`;
    const tagLabel = type === 'manga' ? '🇯🇵 Manga' : type === 'manhwa' ? '🇰🇷 Manhwa' : '🇨🇳 Manhua';

    html += `
      <div class="manga-card" onclick="openDetail('${manga.id}')">
        ${coverUrl
          ? `<img class="manga-cover" src="${coverUrl}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          : ''}
        <div class="manga-cover-placeholder" style="${coverUrl ? 'display:none' : ''}">📚</div>
        <div class="manga-info">
          <div class="manga-title">${title}</div>
          <div class="tag-badge ${tagClass}">${tagLabel}</div>
        </div>
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById('home-content').innerHTML = html;
}

// ════════════════════════════════
// DETAIL
// ════════════════════════════════
async function openDetail(mangaId) {
  state.detailMangaId = mangaId;
  show('detail');
  document.getElementById('detail-content').innerHTML = '<div class="spinner"></div>';

  // Fetch manga + chapters in parallel
  const [mangaData, chapData] = await Promise.all([
    apiFetch(`${API}/manga/${mangaId}?includes[]=cover_art&includes[]=author&includes[]=artist`),
    apiFetch(`${API}/manga/${mangaId}/feed?limit=500&translatedLanguage[]=en&translatedLanguage[]=id&order[chapter]=desc&includes[]=scanlation_group&contentRating[]=safe&contentRating[]=suggestive`)
  ]);

  if (!mangaData?.data) {
    document.getElementById('detail-content').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Gagal memuat detail.</p></div>';
    return;
  }

  const manga = mangaData.data;
  const title = getTitle(manga);
  const desc = getDesc(manga);
  const type = detectType(manga);
  const status = manga.attributes.status;
  const year = manga.attributes.year;

  const coverRel = manga.relationships?.find(r => r.type === 'cover_art');
  const coverFile = coverRel?.attributes?.fileName;
  const coverUrl = getCover(manga.id, coverRel?.id, coverFile);

  const author = manga.relationships?.find(r => r.type === 'author');
  const authorName = author?.attributes?.name || 'Unknown';

  // process chapters
  const chapters = chapData?.data || [];
  // dedupe by chapter number, prefer 'en' then 'id'
  const chapMap = new Map();
  for (const ch of chapters) {
    const num = ch.attributes.chapter || '?';
    const lang = ch.attributes.translatedLanguage;
    if (!chapMap.has(num)) {
      chapMap.set(num, ch);
    } else {
      const existing = chapMap.get(num);
      if (lang === 'id' && existing.attributes.translatedLanguage !== 'id') {
        chapMap.set(num, ch);
      }
    }
  }

  const dedupedChapters = Array.from(chapMap.values())
    .sort((a, b) => parseFloat(b.attributes.chapter || 0) - parseFloat(a.attributes.chapter || 0));

  state.chapters = dedupedChapters;
  state.currentManga = manga;

  const tagClass = `tag-${type}`;
  const tagLabel = type === 'manga' ? '🇯🇵 Manga' : type === 'manhwa' ? '🇰🇷 Manhwa' : '🇨🇳 Manhua';
  const statusColor = status === 'completed' ? 'var(--green)' : status === 'ongoing' ? 'var(--gold)' : 'var(--muted)';

  let html = `
    <div class="detail-hero">
      <div class="detail-cover">
        ${coverUrl ? `<img src="${coverUrl}" alt="${title}">` : '<div style="aspect-ratio:2/3;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:40px;">📚</div>'}
      </div>
      <div class="detail-meta">
        <h1>${title}</h1>
        <div class="meta-row"><span class="tag-badge ${tagClass}">${tagLabel}</span></div>
        <div class="meta-row">Oleh: <b>${authorName}</b></div>
        <div class="meta-row">Status: <b style="color:${statusColor}">${status || 'Unknown'}</b>${year ? ` &nbsp;·&nbsp; <b>${year}</b>` : ''}</div>
        <div class="meta-row">Chapter: <b>${dedupedChapters.length} tersedia</b></div>
        ${desc ? `
          <div class="detail-desc" id="desc-box">${desc.replace(/\n/g,'<br>')}</div>
          <span class="read-more" id="read-more-btn" onclick="toggleDesc()">Baca selengkapnya ▼</span>
        ` : ''}
      </div>
    </div>
    <div class="chapter-head">
      <h3>Daftar Chapter</h3>
      <span class="chapter-count">${dedupedChapters.length} chapter</span>
    </div>
  `;

  if (!dedupedChapters.length) {
    html += `<div class="empty-state"><div class="icon">📭</div><p>Belum ada chapter terjemahan tersedia.</p></div>`;
  } else {
    html += `<div class="chapter-list">`;
    dedupedChapters.forEach((ch, idx) => {
      const num = ch.attributes.chapter || '?';
      const chTitle = ch.attributes.title || '';
      const lang = ch.attributes.translatedLanguage === 'id' ? '🇮🇩' : '🇺🇸';
      const date = formatDate(ch.attributes.publishAt);
      html += `
        <div class="ch-item">
          <div>
            <div class="ch-num">Chapter ${num} ${lang}</div>
            ${chTitle ? `<div class="ch-title">${chTitle}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <div class="ch-meta">${date}</div>
            <button class="ch-read-btn" onclick="openReader(${idx})">Baca</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  document.getElementById('detail-content').innerHTML = html;
}

function toggleDesc() {
  const box = document.getElementById('desc-box');
  const btn = document.getElementById('read-more-btn');
  if (box.classList.toggle('expanded')) {
    btn.textContent = 'Sembunyikan ▲';
  } else {
    btn.textContent = 'Baca selengkapnya ▼';
  }
}

// ════════════════════════════════
// READER
// ════════════════════════════════
async function openReader(idx) {
  state.currentChapterIdx = idx;
  show('reader');

  const ch = state.chapters[idx];
  const num = ch.attributes.chapter || '?';
  const mangaTitle = getTitle(state.currentManga);
  document.getElementById('reader-title').textContent = `${mangaTitle} — Chapter ${num}`;
  document.getElementById('reader-pages').innerHTML = '<div class="spinner"></div>';
  renderReaderNav();

  const data = await apiFetch(`${API}/at-home/server/${ch.id}`);
  if (!data?.chapter) {
    document.getElementById('reader-pages').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Gagal memuat halaman. Coba chapter lain.</p></div>';
    return;
  }

  const baseUrl = data.baseUrl;
  const hash = data.chapter.hash;
  const pages = data.chapter.data; // high quality
  // const pages = data.chapter.dataSaver; // compressed

  let pagesHtml = '';
  for (let i = 0; i < pages.length; i++) {
    const src = `${baseUrl}/data/${hash}/${pages[i]}`;
    pagesHtml += `
      <img class="page-img" src="${src}" alt="Page ${i+1}" loading="lazy"
        onerror="this.style.opacity='.3'" />
    `;
  }

  document.getElementById('reader-pages').innerHTML = pagesHtml || '<div class="empty-state"><div class="icon">📭</div><p>Halaman tidak tersedia.</p></div>';
}

function renderReaderNav() {
  const total = state.chapters.length;
  const idx = state.currentChapterIdx;

  const navHtml = `
    <button class="nav-btn" onclick="openReader(${idx-1})" ${idx===0?'disabled':''}>◀ Chapter Berikutnya</button>
    <span style="font-size:12px;color:#666;align-self:center">${idx+1} / ${total}</span>
    <button class="nav-btn" onclick="openReader(${idx+1})" ${idx>=total-1?'disabled':''}>Chapter Sebelumnya ▶</button>
  `;
  document.getElementById('reader-nav-top').innerHTML = navHtml;
  document.getElementById('reader-nav-bot').innerHTML = navHtml;
}

// ════════════════════════════════
// SEARCH & FILTER
// ════════════════════════════════
function setFilter(f, btn) {
  state.filter = f;
  state.query = '';
  document.getElementById('q').value = '';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  show('home');
  loadHome();
}

function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  state.query = q;
  show('home');
  loadHome();
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// ════════════════════════════════
// INIT
// ════════════════════════════════
loadHome();
</script>
</body>
</html>
